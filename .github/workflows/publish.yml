name: publish to PyPI

# Publishes when you push a version tag (v0.5.0, v0.6.0, ...).
# Auth is PyPI "trusted publishing" (OIDC) — no token stored anywhere.
# One-time setup on pypi.org: Account → Publishing → add a pending publisher
# for project `ttgrep`, this repo, workflow `publish.yml`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
